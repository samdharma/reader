name: republish

on:
  push:
    paths:
      - .github/workflows/republish.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh run download 41875743542 -n reader-windows-x64 -D release
          gh run download 41875743542 -n reader-macos -D release
          gh run download 41875743542 -n reader-linux-x64 -D release || true
          find release -type f -print
      - name: SHA256SUMS
        run: |
          cd release
          sha256sum Reader-* | tee SHA256SUMS
          ls -lh
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          tag=v0.1.0
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber >"$RUNNER_TEMP/gh.log" 2>&1
            code=$?
          else
            gh release create "$tag" release/* --target "${{ github.sha }}" --title "Reader 0.1.0 alpha" --notes-file artifacts/RELEASE_NOTES.md --prerelease >"$RUNNER_TEMP/gh.log" 2>&1
            code=$?
          fi
          if [ "$code" -ne 0 ]; then
            payload=$(tail -n 30 "$RUNNER_TEMP/gh.log" | tr '\n' '~' | sed 's/::/%3A%3A/g')
            echo "::error title=gh-release::$payload"
            exit "$code"
          fi
          gh release view "$tag" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
